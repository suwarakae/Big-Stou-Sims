<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4632" />
      <stop offset="100%" stop-color="#052c1f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle safe-zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Academic Cap / Mortarboard Icon -->
  <g transform="translate(136, 120)">
    <!-- Mortarboard top diamond -->
    <path d="M120 20 L230 65 L120 110 L10 65 Z" fill="url(#goldGrad)"/>
    <!-- Mortarboard skullcap -->
    <path d="M48 85 L48 135 C48 165, 192 165, 192 135 L192 85 Z" fill="#0b4632" stroke="url(#goldGrad)" stroke-width="6"/>
    <!-- Tassel -->
    <path d="M200 78 L220 110 L220 160" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="220" cy="164" r="6" fill="#f6d365"/>
  </g>

  <!-- Open Book representation -->
  <g transform="translate(106, 260)">
    <!-- Book pages -->
    <path d="M150 40 C95 20, 20 25, 0 45 L0 165 C30 145, 95 140, 150 160 C205 140, 270 145, 300 165 L300 45 C280 25, 205 20, 150 40 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Spine divider -->
    <line x1="150" y1="40" x2="150" y2="160" stroke="#0b4632" stroke-width="4"/>
    <!-- Left page text lines -->
    <line x1="30" y1="70" x2="120" y2="70" stroke="#0b4632" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="30" y1="95" x2="120" y2="95" stroke="#0b4632" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="30" y1="120" x2="100" y2="120" stroke="#0b4632" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <!-- Right page text lines -->
    <line x1="180" y1="70" x2="270" y2="70" stroke="#0b4632" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="180" y1="95" x2="270" y2="95" stroke="#0b4632" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="180" y1="120" x2="250" y2="120" stroke="#0b4632" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>

  <!-- Label text STOU -->
  <text x="256" y="465" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#f6d365" text-anchor="middle" letter-spacing="4">มสธ. • STOU</text>
</svg>
